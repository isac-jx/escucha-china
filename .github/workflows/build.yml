name: Construir APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descargar libreria de voz (sherpa-onnx)
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/sherpa-onnx.aar \
            "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.12.21.aar"
          ls -lh app/libs

      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar el APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: EscuchaChina-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
